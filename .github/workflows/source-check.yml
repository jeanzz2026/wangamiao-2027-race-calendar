name: Source and release consistency
on:
  pull_request:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'assets/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.js'
      - 'release.json'
      - 'build-manifest.json'
      - '.github/workflows/source-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:release
